name: Import content from Webflow (one-off)
on:
  push:
    paths: ['scripts/import-webflow.mjs', '.github/workflows/import-webflow.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/import-webflow.mjs
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add import public/images
          git diff --cached --quiet || git commit -m "Import pages and images from live Webflow site"
          git push
